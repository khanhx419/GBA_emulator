<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GBA_K Core</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    /* Hide all default EmulatorJS UI and Virtual Gamepad */
    .ejs_virtualGamepad_parent,
    .ejs_virtualGamepad_open,
    .ejs_virtualGamepad_button,
    .ejs_virtualGamepad_top,
    .ejs_virtualGamepad_bottom,
    .ejs_virtualGamepad_left,
    .ejs_virtualGamepad_right,
    [class*="virtualGamepad"],
    [class*="ejs_virtualGamepad"],
    .ejs_parent .ejs_bar,
    .ejs_parent .ejs_bottom_bar,
    .ejs_parent .ejs_bottom_bar_area,
    .ejs_parent .ejs_context_menu,
    .ejs_parent .ejs_menu_bar,
    .ejs_parent .ejs_menu_bar_hidden,
    .ejs_parent .ejs_cheat_menu,
    .ejs_parent .ejs_control_bar,
    .ejs_parent [class*="ejs_menu"],
    .ejs_parent [class*="ejs_popup"],
    .ejs_parent .ejs_loading_text,
    .ejs_parent .ejs_message,
    .ejs_parent [class*="ejs_message"],
    .ejs_message,
    [class*="ejs_message"],
    .ejs_start_button {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      overflow: hidden !important;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    // Proactively remove any virtual gamepad & message elements injected by EmulatorJS
    // Use a simple class list check instead of querySelectorAll on every mutation
    let cleanupActive = true;
    const cleanupObserver = new MutationObserver((mutations) => {
      if (!cleanupActive) return;
      for (const m of mutations) {
        for (const node of m.addedNodes) {
          if (node.nodeType !== 1) continue;
          const cn = node.className || '';
          if (typeof cn === 'string' && (cn.includes('virtualGamepad') || cn.includes('ejs_message') || cn.includes('ejs_menu_bar'))) {
            node.remove();
          }
        }
      }
    });


    // Receive game configuration from parent
    window.addEventListener('message', function(event) {
      if (!event.data || event.data.type !== 'EJS_INIT_GAME') return;

      const config = event.data;
      window.EJS_player = '#game';
      window.EJS_core = 'gba';
      window.EJS_gameUrl = config.gameUrl;
      window.EJS_gameName = config.gameName || 'GBA_K_Game';
      window.EJS_color = '#000000';
      window.EJS_backgroundColor = '#000000';
      window.EJS_startOnLoaded = true;
      window.EJS_threads = false;
      window.EJS_pathtodata = '/emulatorjs/';
      window.EJS_DEBUG_XX = true;
      window.EJS_noAutoFocus = true;

      // Disable all EmulatorJS default options & menus
      window.EJS_defaultOptions = {
        'virtual-gamepad': 'disabled',
        'menu-bar-button': 'hidden',
        'vsync': 'enabled',
        'save-save-interval': '0'
      };

      window.EJS_Buttons = {
        playPause: false, restart: false, mute: false, settings: false,
        fullscreen: false, saveState: false, loadState: false,
        screenRecord: false, gamepad: false, cheat: false, volume: false,
        saveSavFiles: false, loadSavFiles: false, quickSave: false, quickLoad: false,
        screenshot: false, cacheManager: false
      };

      // Directly inject save data into MEMFS before ROM and core boot
      window.EJS_onSaveDatabaseLoaded = function(fs) {
        if (config.initialSaveData && config.initialSaveData.length > 0) {
          try {
            const u8 = new Uint8Array(config.initialSaveData);
            const safeName = (window.EJS_gameName || 'game').replace(/\.gba$/i, '').trim();
            const paths = [
              `/data/saves/${safeName}.srm`,
              `/data/saves/${safeName}.sav`,
              `/data/saves/game.srm`,
              `/data/saves/game.sav`,
              `/${safeName}.srm`,
              `/${safeName}.sav`
            ];
            for (const p of paths) {
              try {
                fs.writeFile(p, u8);
              } catch (e) {}
            }
            try {
              fs.syncfs(false, () => {});
            } catch (e) {}
            console.log('[GBA_K] Injected initial save data into MEMFS (' + u8.length + ' bytes)!');
          } catch (e) {
            console.error('[GBA_K] Error injecting initial save data:', e);
          }
        }
      };

      window.EJS_onGameStart = function() {
        if (window.EJS_emulator) {
          window.EJS_emulator.displayMessage = function() {}; // Silence all on-screen DOM popups
          if (window.EJS_emulator.virtualGamepad) {
            try { window.EJS_emulator.virtualGamepad.remove(); } catch (e) {}
          }
          if (typeof window.EJS_emulator.toggleVirtualGamepad === 'function') {
            window.EJS_emulator.toggleVirtualGamepad(false);
          }
          // Hook battery save file updates to guarantee permanent IndexedDB persistence
          window.EJS_emulator.on('saveSaveFiles', function(saveData) {
            try {
              const gm = window.EJS_emulator?.gameManager;
              if (gm?.FS) {
                gm.FS.syncfs(false, () => {});
              }
              if (saveData && saveData.length > 0) {
                window.parent.postMessage({
                  type: 'EJS_BATTERY_SAVE_UPDATED',
                  data: Array.from(saveData),
                  romTitle: window.EJS_gameName
                }, '*');
              }
            } catch (e) {}
          });
        }
        // Ensure RetroArch config disables font / OSD notifications and enables frameskip + audio mute during fast-forward
        try {
          const gm = window.EJS_emulator?.gameManager;
          // Enable mGBA core frameskip & idle optimization directly via runtime Cwrap
          if (gm) {
            const setVSync = gm.setVSync || gm.functions?.setVSync;
            if (setVSync) {
              setVSync.call(gm, userVSyncEnabled ? 1 : 0);
            }
            const setVar = gm.setVariable || gm.functions?.setVariable;
            if (setVar) {
              setVar.call(gm, 'mgba_frameskip', '0');
              setVar.call(gm, 'mgba_idle_optimization', 'Remove Known');
              setVar.call(gm, 'mgba_interframe_blending', 'disabled');
              setVar.call(gm, 'mgba_color_correction', 'disabled');
            }
          }
          if (pendingSpeed) {
            applySpeed(pendingSpeed.fastForward, pendingSpeed.speedMultiplier);
          }
        } catch (e) {}
        document.querySelectorAll('.ejs_virtualGamepad_parent, .ejs_virtualGamepad_open, [class*="virtualGamepad"], .ejs_message, [class*="ejs_message"]').forEach(el => el.remove());
        // Stop the MutationObserver — all EJS UI has been cleaned up by now
        cleanupActive = false;
        cleanupObserver.disconnect();
        window.parent.postMessage({ type: 'EJS_GAME_STARTED' }, '*');
      };

      // Auto-unlock audio helper
      function tryUnlockAudio() {
        try {
          if (window.EJS_emulator?.Module?.AL) {
            const al = window.EJS_emulator.Module.AL;
            if (al.currentCtx?.audioCtx && al.currentCtx.audioCtx.state === 'suspended') {
              al.currentCtx.audioCtx.resume().catch(() => {});
            }
          }
        } catch (e) {}
      }

      window.addEventListener('click', tryUnlockAudio);
      window.addEventListener('touchstart', tryUnlockAudio, { passive: true });

      let pendingSpeed = null;

      let userVSyncEnabled = true;

      function flushSaveToDisk() {
        try {
          const gm = window.EJS_emulator?.gameManager;
          if (gm && typeof gm.saveSaveFiles === 'function') {
            gm.saveSaveFiles();
          }
          if (gm?.FS) {
            gm.FS.syncfs(false, () => {});
          }
        } catch (err) {}
      }

      // Safe event-driven flush on app hide or close (never interrupts active gameplay)
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) flushSaveToDisk();
      });
      window.addEventListener('beforeunload', flushSaveToDisk);
      window.addEventListener('pagehide', flushSaveToDisk);

      function applySpeed(fastForward, speedMultiplier) {
        const ratio = Math.max(1, parseFloat(speedMultiplier) || 2.0);
        const ejs = window.EJS_emulator;
        const gm = ejs?.gameManager;

        if (ejs) {
          ejs.isFastForward = !!fastForward;
          if (ejs.settings) {
            ejs.settings['ff-ratio'] = ratio.toString();
            ejs.settings['fastForward'] = fastForward ? 'enabled' : 'disabled';
          }
        }

        if (gm) {
          try {
            const setRatio = gm.setFastForwardRatio || gm.functions?.setFastForwardRatio;
            if (setRatio) {
              setRatio.call(gm, ratio);
            }

            const toggleFF = gm.toggleFastForward || gm.functions?.toggleFastForward;
            if (toggleFF) {
              toggleFF.call(gm, fastForward ? 1 : 0);
            }

            // VSync toggle: Unbind when fast-forwarding or if user disabled VSync
            const setVSync = gm.setVSync || gm.functions?.setVSync;
            if (setVSync) {
              setVSync.call(gm, (fastForward || !userVSyncEnabled) ? 0 : 1);
            }

            // CRITICAL: mGBA libretro mgba_frameskip accepts integers "0" to "10", NOT strings like "auto"
            // For 1x: "0" (no frameskip, perfectly smooth)
            // For 2x: "1" (skip 1 frame)
            // For 3x: "2"
            // For 5x: "4" (skip 4 frames, render 1 frame -> 80% render reduction -> full 5x speed)
            const setVar = gm.setVariable || gm.functions?.setVariable;
            if (setVar) {
              let fsVal = "0";
              if (fastForward && ratio > 1.0) {
                fsVal = Math.min(8, Math.max(1, Math.round(ratio) - 1)).toString();
              }
              setVar.call(gm, 'mgba_frameskip', fsVal);
              setVar.call(gm, 'mgba_idle_optimization', 'Remove Known');
            }

            // Toggle audio_sync: OFF during fast-forward (so audio doesn't throttle CPU),
            // ON at normal speed (so main loop syncs to audio output ~60Hz)
            if (gm.Module && gm.Module.ccall) {
              try {
                gm.Module.ccall('retroarch_set_config_option', 'void', ['string', 'string'],
                  ['audio_sync', fastForward ? 'false' : 'true']);
                gm.Module.ccall('retroarch_set_config_option', 'void', ['string', 'string'],
                  ['video_vsync', (fastForward || !userVSyncEnabled) ? 'false' : 'true']);
              } catch (e) {}
            }
          } catch (err) {}
        }
      }

      window.addEventListener('message', function(e) {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === 'EJS_RESUME_AUDIO') {
          tryUnlockAudio();
        } else if (e.data.type === 'EJS_SET_SPEED') {
          pendingSpeed = { fastForward: e.data.fastForward, speedMultiplier: e.data.speedMultiplier };
          applySpeed(e.data.fastForward, e.data.speedMultiplier);
        } else if (e.data.type === 'EJS_SET_VSYNC') {
          userVSyncEnabled = !!e.data.enabled;
          try {
            const gm = window.EJS_emulator?.gameManager;
            const setVSync = gm?.setVSync || gm?.functions?.setVSync;
            if (setVSync) {
              setVSync.call(gm, (window.EJS_emulator?.isFastForward || !userVSyncEnabled) ? 0 : 1);
            }
            if (gm?.Module?.ccall) {
              gm.Module.ccall('retroarch_set_config_option', 'void', ['string', 'string'],
                ['video_vsync', (window.EJS_emulator?.isFastForward || !userVSyncEnabled) ? 'false' : 'true']);
            }
          } catch (err) {}
        } else if (e.data.type === 'EJS_SET_VOLUME') {
          try {
            const vol = Math.max(0, Math.min(1, parseFloat(e.data.volume) ?? 1.0));
            if (window.EJS_emulator) {
              if (typeof window.EJS_emulator.setVolume === 'function') {
                window.EJS_emulator.setVolume(vol);
              }
              const al = window.EJS_emulator.Module?.AL;
              if (al && al.currentCtx && al.currentCtx.sources) {
                al.currentCtx.sources.forEach(s => {
                  if (s.gain && s.gain.gain) {
                    s.gain.gain.value = vol;
                  }
                });
              }
            }
          } catch (err) {}
        } else if (e.data.type === 'EJS_FLUSH_SAVES') {
          flushSaveToDisk();
        } else if (e.data.type === 'EJS_SET_CHEATS') {
          try {
            const gm = window.EJS_emulator?.gameManager;
            if (gm && typeof gm.setCheat === 'function') {
              if (typeof gm.resetCheat === 'function') gm.resetCheat();
              const codes = e.data.codes || [];
              for (let i = 0; i < codes.length; i++) {
                gm.setCheat(i, 1, codes[i]);
              }
              console.log('[GBA_K] Applied ' + codes.length + ' cheat line(s) to mGBA core.');
            }
          } catch (err) {
            console.warn('[GBA_K] Apply cheats error in iframe:', err);
          }
        }
      });

      // Load loader script
      const script = document.createElement('script');
      script.src = '/emulatorjs/loader.js';
      document.body.appendChild(script);
    });

    // Notify parent that iframe is ready
    window.parent.postMessage({ type: 'EJS_IFRAME_READY' }, '*');
  </script>
</body>
</html>
