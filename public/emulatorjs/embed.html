<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GBA_K Core</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    /* Hide all default EmulatorJS UI and Virtual Gamepad */
    .ejs_virtualGamepad_parent,
    .ejs_virtualGamepad_open,
    .ejs_virtualGamepad_button,
    .ejs_virtualGamepad_top,
    .ejs_virtualGamepad_bottom,
    .ejs_virtualGamepad_left,
    .ejs_virtualGamepad_right,
    [class*="virtualGamepad"],
    [class*="ejs_virtualGamepad"],
    .ejs_parent .ejs_bar,
    .ejs_parent .ejs_bottom_bar,
    .ejs_parent .ejs_bottom_bar_area,
    .ejs_parent .ejs_context_menu,
    .ejs_parent .ejs_menu_bar,
    .ejs_parent .ejs_menu_bar_hidden,
    .ejs_parent .ejs_cheat_menu,
    .ejs_parent .ejs_control_bar,
    .ejs_parent [class*="ejs_menu"],
    .ejs_parent [class*="ejs_popup"],
    .ejs_parent .ejs_loading_text,
    .ejs_parent .ejs_message,
    .ejs_parent [class*="ejs_message"],
    .ejs_message,
    [class*="ejs_message"],
    .ejs_start_button {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      overflow: hidden !important;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <script>
    // Proactively remove any virtual gamepad & message elements injected by EmulatorJS
    const cleanupObserver = new MutationObserver(() => {
      document.querySelectorAll('.ejs_virtualGamepad_parent, .ejs_virtualGamepad_open, [class*="virtualGamepad"], [class*="ejs_virtualGamepad"], [class*="ejs_menu_bar"], .ejs_message, [class*="ejs_message"]').forEach(el => el.remove());
    });
    // Hook EJS_GameManager to guarantee fastforward_frameskip and audio_fastforward_mute
    Object.defineProperty(window, 'EJS_GameManager', {
      configurable: true,
      enumerable: true,
      get() { return this._EJS_GM; },
      set(cls) {
        this._EJS_GM = cls;
        if (cls && cls.prototype) {
          const origGetCfg = cls.prototype.getRetroArchCfg;
          cls.prototype.getRetroArchCfg = function() {
            let cfg = origGetCfg ? origGetCfg.call(this) : '';
            if (!cfg.includes('fastforward_frameskip')) {
              cfg += '\nfastforward_frameskip = true\n';
            }
            if (!cfg.includes('audio_fastforward_mute')) {
              cfg += '\naudio_fastforward_mute = true\n';
            }
            if (!cfg.includes('audio_sync = false')) {
              cfg += '\naudio_sync = false\naudio_rate_control = false\nvideo_vsync = false\n';
            }
            if (!cfg.includes('video_font_enable')) {
              cfg += '\nvideo_font_enable = false\nnotification_show_fast_forward = false\nvideo_message_pos_x = 2.0\nvideo_message_pos_y = 2.0\n';
            }
            return cfg;
          };
        }
      }
    });

    // Receive game configuration from parent
    window.addEventListener('message', function(event) {
      if (!event.data || event.data.type !== 'EJS_INIT_GAME') return;

      const config = event.data;
      window.EJS_player = '#game';
      window.EJS_core = 'gba';
      window.EJS_gameUrl = config.gameUrl;
      window.EJS_gameName = config.gameName || 'GBA_K_Game';
      window.EJS_color = '#000000';
      window.EJS_backgroundColor = '#000000';
      window.EJS_startOnLoaded = true;
      window.EJS_threads = false;
      window.EJS_pathtodata = '/emulatorjs/';
      window.EJS_DEBUG_XX = false;
      window.EJS_noAutoFocus = true;

      // Disable all EmulatorJS default options & menus
      window.EJS_defaultOptions = {
        'virtual-gamepad': 'disabled',
        'menu-bar-button': 'hidden'
      };

      window.EJS_Buttons = {
        playPause: false, restart: false, mute: false, settings: false,
        fullscreen: false, saveState: false, loadState: false,
        screenRecord: false, gamepad: false, cheat: false, volume: false,
        saveSavFiles: false, loadSavFiles: false, quickSave: false, quickLoad: false,
        screenshot: false, cacheManager: false
      };

      window.EJS_onGameStart = function() {
        if (window.EJS_emulator) {
          window.EJS_emulator.displayMessage = function() {}; // Silence all on-screen DOM popups
          if (window.EJS_emulator.virtualGamepad) {
            try { window.EJS_emulator.virtualGamepad.remove(); } catch (e) {}
          }
          if (typeof window.EJS_emulator.toggleVirtualGamepad === 'function') {
            window.EJS_emulator.toggleVirtualGamepad(false);
          }
        }
        // Ensure RetroArch config disables font / OSD notifications and enables frameskip + audio mute during fast-forward
        try {
          const gm = window.EJS_emulator?.gameManager;
          // Enable mGBA core frameskip & idle optimization directly via runtime Cwrap
          if (gm) {
            const setVar = gm.setVariable || gm.functions?.setVariable;
            if (setVar) {
              setVar.call(gm, 'mgba_frameskip', 'auto');
              setVar.call(gm, 'mgba_idle_optimization', 'Remove Known');
              setVar.call(gm, 'mgba_interframe_blending', 'disabled');
              setVar.call(gm, 'mgba_color_correction', 'disabled');
            }
          }
          if (pendingSpeed) {
            applySpeed(pendingSpeed.fastForward, pendingSpeed.speedMultiplier);
          }
        } catch (e) {}
        document.querySelectorAll('.ejs_virtualGamepad_parent, .ejs_virtualGamepad_open, [class*="virtualGamepad"], .ejs_message, [class*="ejs_message"]').forEach(el => el.remove());
        window.parent.postMessage({ type: 'EJS_GAME_STARTED' }, '*');
      };

      // Auto-unlock audio helper
      function tryUnlockAudio() {
        try {
          if (window.EJS_emulator?.Module?.AL) {
            const al = window.EJS_emulator.Module.AL;
            if (al.currentCtx?.audioCtx && al.currentCtx.audioCtx.state === 'suspended') {
              al.currentCtx.audioCtx.resume().catch(() => {});
            }
          }
        } catch (e) {}
      }

      window.addEventListener('click', tryUnlockAudio);
      window.addEventListener('touchstart', tryUnlockAudio, { passive: true });

      let pendingSpeed = null;

      function applySpeed(fastForward, speedMultiplier) {
        const ratio = Math.max(1, parseFloat(speedMultiplier) || 2.0);
        const ejs = window.EJS_emulator;
        const gm = ejs?.gameManager;

        if (ejs) {
          ejs.isFastForward = !!fastForward;
          if (ejs.settings) {
            ejs.settings['ff-ratio'] = ratio.toString();
            ejs.settings['fastForward'] = fastForward ? 'enabled' : 'disabled';
          }
        }

        if (gm) {
          try {
            const setRatio = gm.setFastForwardRatio || gm.functions?.setFastForwardRatio;
            if (setRatio) {
              setRatio.call(gm, ratio);
            }

            const toggleFF = gm.toggleFastForward || gm.functions?.toggleFastForward;
            if (toggleFF) {
              toggleFF.call(gm, fastForward ? 1 : 0);
            }

            // CRITICAL: Unbind VSync / rAF when fast-forwarding so Emscripten main loop
            // switches from rAF (60Hz display lock) to setImmediate (mode 2).
            // When returning to 1x normal speed, re-enable VSync (mode 1 / rAF).
            const setVSync = gm.setVSync || gm.functions?.setVSync;
            if (setVSync) {
              setVSync.call(gm, fastForward ? 0 : 1);
            }

            const setVar = gm.setVariable || gm.functions?.setVariable;
            if (setVar) {
              setVar.call(gm, 'mgba_frameskip', fastForward ? 'auto' : 'disabled');
              setVar.call(gm, 'mgba_idle_optimization', 'Remove Known');
            }
          } catch (err) {}
        }
      }

      window.addEventListener('message', function(e) {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === 'EJS_RESUME_AUDIO') {
          tryUnlockAudio();
        } else if (e.data.type === 'EJS_SET_SPEED') {
          pendingSpeed = { fastForward: e.data.fastForward, speedMultiplier: e.data.speedMultiplier };
          applySpeed(e.data.fastForward, e.data.speedMultiplier);
        }
      });

      // Load loader script
      const script = document.createElement('script');
      script.src = '/emulatorjs/loader.js';
      document.body.appendChild(script);
    });

    // Notify parent that iframe is ready
    window.parent.postMessage({ type: 'EJS_IFRAME_READY' }, '*');
  </script>
</body>
</html>
